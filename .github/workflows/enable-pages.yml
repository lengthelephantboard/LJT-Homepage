name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages via gh with admin token
        run: |
          # Try with GITHUB_TOKEN first
          gh api -X POST repos/${{ github.repository }}/pages -f "build_type=workflow" 2>&1 || echo "GITHUB_TOKEN failed"
          # Check status
          gh api repos/${{ github.repository }}/pages 2>&1 || echo "Pages not enabled"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Try with PAT if available
        run: |
          if [ -n "${{ secrets.PAGES_TOKEN }}" ]; then
            curl -X POST \
              -H "Authorization: token ${{ secrets.PAGES_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"build_type":"workflow"}'
          else
            echo "No PAGES_TOKEN secret"
          fi
