name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages
        run: |
          gh api -X POST repos/${{ github.repository }}/pages \
            -f "build_type=workflow" \
            || echo "Pages may already be enabled"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Pages status
        run: |
          gh api repos/${{ github.repository }}/pages || echo "Pages not enabled"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
