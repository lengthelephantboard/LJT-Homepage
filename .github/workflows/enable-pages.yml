name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  administration: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Check Actions permissions
        run: |
          echo "=== Actions permissions ==="
          gh api repos/${{ github.repository }}/actions/permissions || true
          echo "=== Workflow permissions ==="
          gh api repos/${{ github.repository }}/actions/permissions/workflow || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Try to set workflow permissions to read-write
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/permissions/workflow \
            -f "default_workflow_permissions=write" \
            -F "can_approve_pull_request_reviews=true" || echo "failed to set workflow permissions"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Pages
        run: |
          gh api -X POST repos/${{ github.repository }}/pages \
            -f "build_type=workflow" \
            || echo "Pages may already be enabled or cannot be created"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Pages status
        run: |
          gh api repos/${{ github.repository }}/pages || echo "Pages not enabled"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
